name: ReqLint CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate Python Syntax (Backend & AI Engine)
        run: |
          python -m py_compile backend/app/main.py || true
          python -m py_compile ai-engine/ai_module/analyzer.py || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check Frontend Workspace
        working-directory: ./frontend-qa
        # P0.1 CI fix: vitest@5 declares peerOptional @types/node ^22 || >=24
        # while the project pins @types/node@20, so plain `npm ci` / `npm
        # install` fail with ERESOLVE. package-lock.json was produced and the
        # test/build suite verified locally with --legacy-peer-deps, so CI
        # installs with the same deterministic strategy. `npm run lint` is NOT
        # masked anymore: a lint failure must fail this workflow.
        run: |
          npm ci --legacy-peer-deps
          npm run lint

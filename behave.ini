# Konfigurasi BDD (behave) untuk seluruh proyek ReqLint.
# Jalankan dari root repo:   python -m behave
# Dengan browser terbuka:    python -m behave -D headless=false
# Mode cepat (headless):     python -m behave -D open_browser=false
[behave]
paths = features
format = pretty
show_timings = true
logging_level = WARNING

[behave.userdata]
open_browser = true
headless = false
step_delay = 0.25
frontend_url = http://localhost:3000
backend_url = http://localhost:8000

[pytest]
pythonpath = .
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore:.*InconsistentVersionWarning.*
    ignore:.*StarletteDeprecationWarning.*
markers =
    bdd: Behavioral-driven development test scenario
    auth: Authentication and session scenarios
    audit: Story audit scenarios
    input_story: User story input scenarios
    pdf: PDF document upload and extraction scenarios
    upload: Upload file scenarios
    scorecard: Quality scorecard and INVEST scenarios
    invest: INVEST rubric and compliance scenarios
    revision: 1-Click apply and manual edit scenarios
    apply: Recommendation apply scenarios
    history: Audit history log and search scenarios
    search: Search filter scenarios
    export: Document export scenarios
    reporting: Report generation scenarios
    security: Security and access control scenarios
    isolation: Cross-user data isolation scenarios
    sec4: SRS SEC-4 compliance scenarios
